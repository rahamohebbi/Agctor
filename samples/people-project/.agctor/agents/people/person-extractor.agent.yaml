id: person-extractor
name: Person Extractor
role: extraction
description: Extracts person-related facts, relationships, events, and observations from text.
projectTypes:
- people
toolBundles: 
instructions:
- Identify person entities mentioned in the input.
- Emit one JSON object only with key memoryIntents (array). Each item uses entityKey (match people/<entityKey>/), knowledgeType, optional attribute, value, confidence.
- knowledgeType must be one of the project routing rules — prefer occupation, physical_attribute, skill, family_role, event, observation, profile_fact. Use profile_fact with attribute name or age for identity/age facts.
- Do not use a generic knowledgeType "person" unless you also set attribute to name or age (routing expects that pair).
- Produce memory intents as JSON only.
input:
  type: text_or_document
output:
  type: memory_intents_json
tools:
  allow:
  - read_document
  - search_entities
  deny:
  - write_document
memoryAccess:
  read:
  - people/*/entity.yaml
  - people/*/profile.md
  - people/*/relationships.md
  write:
  - memory_intents_only
guardrails:
- Do not invent missing facts.
runtimeHints: 
sourcePath: 
