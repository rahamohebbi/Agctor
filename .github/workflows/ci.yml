name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Agctor.sln

      - name: Build
        run: dotnet build Agctor.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test AgctorSDK.Core.Tests --no-build --configuration Release --verbosity normal

      # net10 only: dual TFM left Proto.Actor threads that never exited after a green run (6h cancel).
      - name: Core integration tests (no Ollama)
        timeout-minutes: 10
        run: >
          dotnet test AgctorSDK.Core.IntegrationTests
          -f net10.0
          --no-build --configuration Release --verbosity normal
          --filter "TestCategory!=RequiresOllama"
          --blame-hang-timeout 5m

      # Still run Host if Core times out, so API/projector coverage is not blocked by that hang.
      - name: Host integration tests
        if: success() || failure()
        run: dotnet test AgctorSDK.Host.IntegrationTests --no-build --configuration Release --verbosity normal
