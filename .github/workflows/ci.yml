name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Host ITs spawn many WebApplicationFactory hosts; avoid FileSystemWatcher/inotify burn.
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x

      # Parallel Host factories exceed Ubuntu's default 128 inotify instances.
      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=1024
          sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Restore
        run: dotnet restore Agctor.sln

      - name: Build
        run: dotnet build Agctor.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test AgctorSDK.Core.Tests --no-build --configuration Release --verbosity normal

      # net10 only: dual TFM left Proto.Actor threads that never exited after a green run (6h cancel).
      - name: Core integration tests (no Ollama)
        timeout-minutes: 10
        run: >
          dotnet test AgctorSDK.Core.IntegrationTests
          -f net10.0
          --no-build --configuration Release --verbosity normal
          --filter "TestCategory!=RequiresOllama"
          --blame-hang-timeout 5m

      # Skip Host after Core abort: hang dumps exhaust inotify and poison WebApplicationFactory.
      - name: Host integration tests
        run: dotnet test AgctorSDK.Host.IntegrationTests --no-build --configuration Release --verbosity normal
