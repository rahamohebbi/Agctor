name: Bug report
description: Something is broken or behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for a report. Please do **not** include secrets. Security issues go to SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, API calls, or a minimal code snippet.
      render: csharp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agctor commit or version
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK (`dotnet --version`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: true
